<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Falkyria" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Painel Falkyria: uso anônimo do Nicx, só para administradores." />
  <link rel="icon" href="/nicx-painel/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/nicx-painel/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/nicx-painel/apple-touch-icon.png" />
  <title>Painel Falkyria</title>
  <script>
    // Tema antes da primeira pintura, sem piscar.
    (function () {
      var r = document.documentElement;
      try {
        var s = localStorage.getItem('nicx-painel-theme');
        var dark = s === 'dark' || (s !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        r.classList.add(dark ? 'dark' : 'light');
      } catch (e) {
        r.classList.add('light');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>O Painel Falkyria precisa de JavaScript.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
